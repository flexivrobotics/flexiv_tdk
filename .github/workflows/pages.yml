name: pages

on:
  push:
    branches:
      - v1.x
  pull_request:
    branches: [v1.x]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history and tags are required to build Doxygen for each v1 release.
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install MkDocs
        run: |
          python -m pip install --upgrade pip
          pip install mkdocs-material

      - name: Install Doxygen
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen graphviz

      - name: Generate Doxygen HTML (v1 release tags)
        env:
          API_VERSION_PREFIX: v1
        run: bash docs/doxygen/build_api_docs.sh

      - name: Build MkDocs site
        run: mkdocs build --clean

      - name: Upload PR preview artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: pr-preview-site
          path: site

      - name: Publish v1 to gh-pages
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/v1.x'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash docs/publish_gh_pages.sh v1
